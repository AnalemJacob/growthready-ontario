name: Validate explorer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: node --check assets/app.js
      - run: node --check assets/case.js
      - run: node --check assets/case-model.js
      - run: python -m py_compile scripts/fetch_york_data.py scripts/build_web_data.py scripts/analyse_vaughan.py scripts/build_vaughan_brief.py scripts/validate_qgis.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-accessibility-results
          path: test-results/
  tag-release:
    name: Tag validated release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag package version without replacing an existing tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; leaving it unchanged."
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" -m "GrowthReady Ontario $tag — York Region pilot"
            git push origin "refs/tags/$tag"
          fi
